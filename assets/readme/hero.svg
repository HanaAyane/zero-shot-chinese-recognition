<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" fill="none">
  <title>零样本汉字识别 — 3755 个汉字无需手写样本即可识别，深度嵌入 + Transformer 解码</title>
  <defs>
    <!-- Ink wash background -->
    <linearGradient id="inkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f12"/>
      <stop offset="40%" stop-color="#14141a"/>
      <stop offset="100%" stop-color="#1a1a22"/>
    </linearGradient>

    <!-- Warm ink accent -->
    <radialGradient id="inkGlow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#8b6914" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0f0f12" stop-opacity="0"/>
    </radialGradient>

    <!-- Rice grid pattern -->
    <pattern id="riceGrid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="none"/>
      <line x1="40" y1="0" x2="40" y2="80" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
      <line x1="0" y1="40" x2="80" y2="40" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
      <line x1="0" y1="0" x2="80" y2="80" stroke="#ffffff" stroke-width="0.2" stroke-opacity="0.03"/>
      <line x1="80" y1="0" x2="0" y2="80" stroke="#ffffff" stroke-width="0.2" stroke-opacity="0.03"/>
      <rect x="0" y="0" width="80" height="80" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.06"/>
    </pattern>

    <!-- Gold accent -->
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- Glass card -->
    <linearGradient id="inkCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Decomposition arrow -->
    <marker id="arrowGold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d4a574" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#inkBg)"/>
  <rect width="1200" height="600" fill="url(#riceGrid)"/>
  <rect width="1200" height="600" fill="url(#inkGlow)"/>

  <!-- Left: Project identity -->
  <g transform="translate(80, 80)">
    <!-- Gold accent line -->
    <rect x="0" y="0" width="4" height="160" rx="2" fill="url(#goldAccent)"/>

    <!-- Title -->
    <text x="28" y="42" font-family="PingFang SC, STSong, SimSun, system-ui, serif" font-size="44" font-weight="700" fill="#e8dcc8" letter-spacing="2">零样本汉字识别</text>
    <text x="28" y="80" font-family="SF Pro Display, system-ui, sans-serif" font-size="20" font-weight="500" fill="#8b8680" letter-spacing="0.5">Zero-Shot Chinese Character Recognition</text>

    <!-- Tagline chips -->
    <g transform="translate(28, 108)">
      <rect x="0" y="0" width="72" height="28" rx="14" fill="url(#inkCard)" stroke="#d4a574" stroke-width="0.5" stroke-opacity="0.25"/>
      <text x="36" y="19" font-family="SF Pro Text, system-ui, sans-serif" font-size="13" font-weight="600" fill="#d4a574" text-anchor="middle">3755 字</text>

      <rect x="84" y="0" width="96" height="28" rx="14" fill="url(#inkCard)" stroke="#d4a574" stroke-width="0.5" stroke-opacity="0.25"/>
      <text x="132" y="19" font-family="SF Pro Text, system-ui, sans-serif" font-size="13" font-weight="600" fill="#d4a574" text-anchor="middle">Acc 90.17%</text>

      <rect x="192" y="0" width="76" height="28" rx="14" fill="url(#inkCard)" stroke="#d4a574" stroke-width="0.5" stroke-opacity="0.25"/>
      <text x="230" y="19" font-family="SF Pro Text, system-ui, sans-serif" font-size="13" font-weight="600" fill="#d4a574" text-anchor="middle">Transformer</text>

      <rect x="280" y="0" width="66" height="28" rx="14" fill="url(#inkCard)" stroke="#d4a574" stroke-width="0.5" stroke-opacity="0.25"/>
      <text x="313" y="19" font-family="SF Pro Text, system-ui, sans-serif" font-size="13" font-weight="600" fill="#d4a574" text-anchor="middle">Gradio</text>
    </g>

    <!-- Short description -->
    <text x="28" y="180" font-family="PingFang SC, system-ui, sans-serif" font-size="16" fill="#6b6560" letter-spacing="1">看偏旁，就能认字——无需手写训练样本</text>
  </g>

  <!-- Right: Character decomposition visualization -->
  <g transform="translate(620, 60)">
    <!-- Outer card -->
    <rect x="0" y="0" width="500" height="480" rx="16" fill="url(#inkCard)" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>

    <!-- Card inner: decomposition diagram -->
    <!-- Central character "明" -->
    <g transform="translate(250, 120)">
      <!-- Rice grid behind character -->
      <rect x="-80" y="-80" width="160" height="160" fill="none"/>
      <line x1="0" y1="-80" x2="0" y2="80" stroke="#d4a574" stroke-width="0.4" stroke-opacity="0.15"/>
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#d4a574" stroke-width="0.4" stroke-opacity="0.15"/>
      <line x1="-80" y1="-80" x2="80" y2="80" stroke="#d4a574" stroke-width="0.3" stroke-opacity="0.1"/>
      <line x1="80" y1="-80" x2="-80" y2="80" stroke="#d4a574" stroke-width="0.3" stroke-opacity="0.1"/>
      <rect x="-80" y="-80" width="160" height="160" stroke="#d4a574" stroke-width="0.6" stroke-opacity="0.15"/>

      <!-- Character 明 -->
      <text x="0" y="18" font-family="PingFang SC, STKaiti, KaiTi, SimSun, serif" font-size="72" font-weight="400" fill="#e8dcc8" text-anchor="middle" dominant-baseline="middle">明</text>
    </g>

    <!-- Decomposition arrows -->
    <!-- Arrow from 明 to 日 (left branch) -->
    <line x1="180" y1="200" x2="100" y2="250" stroke="#d4a574" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6,4" marker-end="url(#arrowGold)"/>
    <!-- Arrow from 明 to 月 (right branch) -->
    <line x1="320" y1="200" x2="400" y2="250" stroke="#d4a574" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6,4" marker-end="url(#arrowGold)"/>

    <!-- Left component: 日 -->
    <g transform="translate(50, 260)">
      <rect x="-40" y="-40" width="80" height="80" rx="8" fill="url(#inkCard)" stroke="#d4a574" stroke-width="0.5" stroke-opacity="0.2"/>
      <text x="0" y="6" font-family="PingFang SC, STKaiti, KaiTi, SimSun, serif" font-size="36" fill="#e8dcc8" text-anchor="middle" dominant-baseline="middle">日</text>
      <text x="0" y="60" font-family="SF Pro Text, system-ui, sans-serif" font-size="11" fill="#6b6560" text-anchor="middle">rì · sun</text>
    </g>

    <!-- Right component: 月 -->
    <g transform="translate(450, 260)">
      <rect x="-40" y="-40" width="80" height="80" rx="8" fill="url(#inkCard)" stroke="#d4a574" stroke-width="0.5" stroke-opacity="0.2"/>
      <text x="0" y="6" font-family="PingFang SC, STKaiti, KaiTi, SimSun, serif" font-size="36" fill="#e8dcc8" text-anchor="middle" dominant-baseline="middle">月</text>
      <text x="0" y="60" font-family="SF Pro Text, system-ui, sans-serif" font-size="11" fill="#6b6560" text-anchor="middle">yuè · moon</text>
    </g>

    <!-- Pipeline description at bottom -->
    <g transform="translate(24, 380)">
      <!-- Pipeline steps -->
      <rect x="0" y="0" width="452" height="80" rx="12" fill="url(#inkCard)" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>

      <!-- Step 1: 部件分解 -->
      <g transform="translate(30, 22)">
        <rect x="0" y="0" width="70" height="36" rx="6" fill="#d4a574" fill-opacity="0.1" stroke="#d4a574" stroke-width="0.5" stroke-opacity="0.3"/>
        <text x="35" y="14" font-family="SF Pro Text, system-ui, sans-serif" font-size="10" font-weight="600" fill="#d4a574" text-anchor="middle">IDS 分解</text>
        <text x="35" y="28" font-family="SF Pro Text, system-ui, sans-serif" font-size="9" fill="#8b8680" text-anchor="middle">部件 Embedding</text>
      </g>

      <text x="118" y="42" fill="#d4a574" font-size="16" opacity="0.4">→</text>

      <!-- Step 2: 视觉提取 -->
      <g transform="translate(142, 22)">
        <rect x="0" y="0" width="78" height="36" rx="6" fill="#d4a574" fill-opacity="0.1" stroke="#d4a574" stroke-width="0.5" stroke-opacity="0.3"/>
        <text x="39" y="14" font-family="SF Pro Text, system-ui, sans-serif" font-size="10" font-weight="600" fill="#d4a574" text-anchor="middle">DenseNet+DSBN</text>
        <text x="39" y="28" font-family="SF Pro Text, system-ui, sans-serif" font-size="9" fill="#8b8680" text-anchor="middle">双域视觉特征</text>
      </g>

      <text x="238" y="42" fill="#d4a574" font-size="16" opacity="0.4">→</text>

      <!-- Step 3: 跨注意力匹配 -->
      <g transform="translate(262, 22)">
        <rect x="0" y="0" width="90" height="36" rx="6" fill="#d4a574" fill-opacity="0.12" stroke="#d4a574" stroke-width="0.5" stroke-opacity="0.35"/>
        <text x="45" y="14" font-family="SF Pro Text, system-ui, sans-serif" font-size="10" font-weight="600" fill="#d4a574" text-anchor="middle">Cross-Attention</text>
        <text x="45" y="28" font-family="SF Pro Text, system-ui, sans-serif" font-size="9" fill="#8b8680" text-anchor="middle">Transformer 解码</text>
      </g>

      <text x="370" y="42" fill="#d4a574" font-size="16" opacity="0.4">→</text>

      <!-- Step 4: Top-K -->
      <g transform="translate(390, 22)">
        <rect x="0" y="0" width="48" height="36" rx="6" fill="#d4a574" fill-opacity="0.1" stroke="#d4a574" stroke-width="0.5" stroke-opacity="0.3"/>
        <text x="24" y="14" font-family="SF Pro Text, system-ui, sans-serif" font-size="10" font-weight="600" fill="#d4a574" text-anchor="middle">Top-5</text>
        <text x="24" y="28" font-family="SF Pro Text, system-ui, sans-serif" font-size="9" fill="#8b8680" text-anchor="middle">结果</text>
      </g>
    </g>
  </g>

  <!-- Bottom-left: Citation-style info -->
  <g transform="translate(80, 530)">
    <text font-family="SF Pro Text, system-ui, sans-serif" font-size="11" fill="#4a4640">
      DenseNet DSBN Backbone · ZSDecoder (1-layer, 4-head) · IDS Structural Embedding · Song Font Template
    </text>
  </g>
</svg>
