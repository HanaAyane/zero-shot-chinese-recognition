<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">零样本汉字识别</title>
  <desc id="desc">用汉字结构与字形模板匹配单字图像。Gradio 演示覆盖配套字表中的 3755 个汉字，自动选择 CPU 或 CUDA，输出 Top-K 候选。明字为结构示意。</desc>
  <defs>
    <pattern id="paper" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.65" fill="#D6D9D1" opacity="0.32"/></pattern>
  </defs>
  <rect width="1200" height="440" fill="#F7F4ED" rx="24"/>
  <rect width="1200" height="440" fill="url(#paper)" rx="24"/>
  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
    <g id="title-block">
      <rect x="64" y="55" width="10" height="25" rx="3" fill="#247D6D"/>
      <text x="89" y="76" font-size="20" letter-spacing="2.3" font-weight="600" fill="#247D6D">ZERO-SHOT CHINESE RECOGNITION</text>
      <text x="60" y="169" font-size="68" font-weight="750" letter-spacing="1" fill="#152C2A">零样本汉字识别</text>
      <text x="65" y="227" font-size="29" fill="#52645E">用结构与字形，让单字图像找到候选。</text>
      <g transform="translate(65 267)">
        <text x="0" y="29" font-size="29" font-weight="600" fill="#152C2A">单字图像</text>
        <path d="M149 19H232m-12-9 12 9-12 9" fill="none" stroke="#247D6D" stroke-width="2.5"/>
        <text x="251" y="29" font-size="29" font-weight="600" fill="#152C2A">Top-K 候选</text>
      </g>
      <path d="M65 334H663" stroke="#D6D9D1" stroke-width="1.5"/>
      <text x="65" y="380" font-size="24" font-weight="600" fill="#247D6D">3755 字表</text>
      <circle cx="217" cy="372" r="3" fill="#C06C40"/>
      <text x="240" y="380" font-size="24" fill="#52645E">CPU / CUDA</text>
      <circle cx="415" cy="372" r="3" fill="#C06C40"/>
      <text x="438" y="380" font-size="24" fill="#52645E">Gradio 演示</text>
    </g>
    <g id="character-specimen">
      <path d="M749 55V383" stroke="#D6D9D1" stroke-width="1.5"/>
      <rect x="815" y="73" width="277" height="225" rx="18" fill="#E9EDE5"/>
      <path d="M953.5 84V287M827 185.5H1080" stroke="#C6D0C7" stroke-width="1" stroke-dasharray="5 8"/>
      <text x="953" y="253" text-anchor="middle" font-family="KaiTi,STKaiti,'Noto Serif CJK SC',serif" font-size="195" fill="#152C2A">明</text>
      <path d="M953.5 303V322M953.5 322H883V340M953.5 322H1024V340" fill="none" stroke="#247D6D" stroke-width="2"/>
      <text x="883" y="379" text-anchor="middle" font-size="41" font-family="'Microsoft YaHei','PingFang SC',sans-serif" fill="#247D6D">日</text>
      <text x="1024" y="379" text-anchor="middle" font-size="41" font-family="'Microsoft YaHei','PingFang SC',sans-serif" fill="#247D6D">月</text>
      <text x="954" y="410" text-anchor="middle" font-size="18" letter-spacing="2" fill="#52645E">IDS 部件结构示意</text>
    </g>
  </g>
</svg>
